name: CI - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'ordinary' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify complete event scope and check prose
        id: scope
        run: python3 -B .github/scripts/ci_scope.py

      - name: Test CI scope safety
        if: steps.scope.outputs.run_full != 'false'
        run: python3 -B .github/scripts/test_ci_scope.py

      - name: Set up Node.js
        if: steps.scope.outputs.run_full != 'false'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 18
          package-manager-cache: false

      - name: Install dependencies (with legacy-peer-deps)
        if: steps.scope.outputs.run_full != 'false'
        run: npm install --legacy-peer-deps

      - name: Run tests
        if: steps.scope.outputs.run_full != 'false'
        run: npx vitest run
